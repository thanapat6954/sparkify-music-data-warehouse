services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PGUSER:-sparkify}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Copy .env.example to .env and choose a password}
      POSTGRES_DB: ${PGDATABASE:-sparkify}
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  pipeline:
    build:
      context: ${SPARKIFY_BUILD_CONTEXT:-.}
    profiles: [run]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-sparkify}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:-sparkify}
    volumes:
      - ./dataset/dataset:/app/dataset/dataset:ro
      - ./reports:/app/reports
    depends_on:
      postgres: {condition: service_healthy}
    command: ["--target", "postgres"]
  metabase:
    image: metabase/metabase:v0.56.2
    profiles: [bi]
    ports: ["127.0.0.1:23000:3000"]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ANON_TRACKING_ENABLED: 'false'
    volumes: ["metabase_data:/metabase-data"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
  metabase_data:
